<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EOF 主成分分析</title>
<style>
  :root{
    --bg:#fbfbfa; --card:#fff; --ink:#18181b; --ink2:#52525b; --muted:#8b8b93;
    --line:#e8e8e5; --line2:#d6d6d2; --accent:#2f6df6; --fig:#ffffff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0c0c0d; --card:#151517; --ink:#ededef; --ink2:#a1a1aa; --muted:#71717a;
           --line:#26262a; --line2:#34343a; --accent:#5b8dff; }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:44px 24px 90px}

  header h1{margin:0 0 6px;font-size:25px;font-weight:650;letter-spacing:-.02em}
  header p{margin:0;color:var(--ink2);font-size:14.5px}
  header .eq{margin-top:12px;font-family:var(--mono);font-size:13px;color:var(--muted)}
  header .eq b{color:var(--ink2);font-weight:600}

  .tabs{display:inline-flex;gap:2px;margin-top:24px;padding:3px;border-radius:10px;
        background:var(--line);border:1px solid var(--line)}
  .tab{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13.5px;
       padding:7px 18px;border-radius:7px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--card);color:var(--ink);font-weight:560;box-shadow:0 1px 3px rgba(0,0,0,.07)}

  .src{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.85}
  .src b{color:var(--ink2);font-weight:600}
  .src code{font-family:var(--mono);font-size:12px;background:var(--line);padding:1px 5px;border-radius:4px}
  .src a{color:var(--accent);text-decoration:none}
  .src a:hover{text-decoration:underline}

  .panel{
    margin-top:18px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:16px 18px;
    display:flex;gap:22px;flex-wrap:wrap;align-items:center;
  }
  .ctl{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);white-space:nowrap}
  .ctl input[type=range]{width:110px;accent-color:var(--accent);cursor:pointer}
  .ctl output{font-family:var(--mono);font-size:12px;color:var(--ink);min-width:26px;text-align:right}
  .spacer{flex:1}
  button.act{font:inherit;font-size:13px;padding:7px 15px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line2);background:transparent;color:var(--ink);transition:.15s}
  button.act:hover{background:var(--line)}

  section{margin-top:34px}
  .st{display:flex;align-items:baseline;gap:9px;margin-bottom:11px;
      font-size:13.5px;font-weight:600;letter-spacing:.01em}
  .st span{font-weight:400;color:var(--muted);font-size:12.5px;font-family:var(--mono)}

  .fig{background:var(--fig);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:hidden}
  canvas{display:block;width:100%}
  .axis{display:flex;justify-content:space-between;font-size:11px;color:#9a9a94;margin-top:6px;font-family:var(--mono)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}

  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:flex;align-items:center;gap:12px;font-size:12.5px}
  .bar .lab{width:52px;color:var(--muted);font-family:var(--mono);flex:none}
  .bar .track{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;border-radius:4px;transition:width .25s cubic-bezier(.32,.72,0,1)}
  .bar .val{width:56px;text-align:right;font-family:var(--mono);color:var(--ink2);flex:none}

  .kbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:13px}
  .kbar .ctl input[type=range]{width:150px}
  .res{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
  .res b{font-weight:600}

  ul.pts{margin:14px 0 0;padding-left:18px;color:var(--ink2);font-size:13.5px;line-height:1.9}
  ul.pts li::marker{color:var(--muted)}
  ul.pts b{font-weight:600;color:var(--ink)}

  .evt{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.9}
  .evt code{font-family:var(--mono);font-size:12px;background:var(--line);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>EOF 主成分分析</h1>
    <p>把一个随时间变化的场，拆成几个正交的空间模态，以及各自的时间系数。</p>
    <div class="eq">X(t, x) &nbsp;=&nbsp; <b>Σ</b><sub>k</sub> &nbsp;PC<sub>k</sub>(t) · EOF<sub>k</sub>(x)</div>
  </header>

  <div class="tabs">
    <button class="tab on" data-m="syn">合成数据</button>
    <button class="tab" data-m="tao">TAO 实测</button>
  </div>

  <div class="src" id="src"></div>

  <div class="panel" id="synPanel">
    <div class="ctl">模态一 <input type="range" id="s-a1" min="0" max="100" value="50"><output id="o-a1"></output></div>
    <div class="ctl">模态二 <input type="range" id="s-a2" min="0" max="100" value="36"><output id="o-a2"></output></div>
    <div class="ctl">噪声 <input type="range" id="s-nz" min="0" max="100" value="12"><output id="o-nz"></output></div>
    <div class="spacer"></div>
    <button class="act" id="btn-new">换一组</button>
  </div>

  <section>
    <div class="st">原始场 <span id="rawLab">X(t, x)</span></div>
    <div class="fig"><canvas id="c-raw" height="300"></canvas></div>
    <div class="axis"><span id="axL"></span><span id="axR"></span></div>
  </section>

  <section>
    <div class="st">方差贡献 <span>λₖ / Σλ</span></div>
    <div class="bars" id="bars"></div>
    <div class="evt" id="evt"></div>
  </section>

  <section class="grid2" id="modes"></section>

  <section>
    <div class="st">重建 <span>用前 k 阶还原</span></div>
    <div class="kbar">
      <div class="ctl">阶数 k <input type="range" id="s-k" min="1" max="5" value="2"><output id="o-k"></output></div>
      <div class="res">残差方差 <b id="resid">—</b></div>
    </div>
    <div class="fig"><canvas id="c-rec" height="300"></canvas></div>
  </section>

  <ul class="pts" id="pts"></ul>

</div>

      out.push(row);
    }
    return out;
  }

  /* ================= 画图 ================= */
  var CM1=[42,92,158], CM0=[246,246,244], CM2=[176,58,44];
  function color(v){
    v=Math.max(-1,Math.min(1,v));
    var a,b,u;
    if (v<0){ a=CM1;b=CM0;u=v+1; } else { a=CM0;b=CM2;u=v; }
    return [Math.round(a[0]+(b[0]-a[0])*u), Math.round(a[1]+(b[1]-a[1])*u), Math.round(a[2]+(b[2]-a[2])*u)];
  }
  function prep(canvas){
    if (!canvas.dataset.h) canvas.dataset.h = canvas.getAttribute('height')||'120';
    var h = parseFloat(canvas.dataset.h);
    canvas.style.height = h+'px';
    var w = canvas.clientWidth||400, dpr = window.devicePixelRatio||1;
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function heat(canvas, M, fixedMax, center){
    center = center || 0;
    var nt=M.length, nx=M[0].length, i, t, mx=0;
    if (fixedMax==null){ for (t=0;t<nt;t++) for (i=0;i<nx;i++) mx=Math.max(mx,Math.abs(M[t][i]-center)); }
    else mx = fixedMax;
    if (mx<1e-9) mx=1;
    var off=document.createElement('canvas'); off.width=nx; off.height=nt;
    var oc=off.getContext('2d'), img=oc.createImageData(nx,nt);
    for (t=0;t<nt;t++) for (i=0;i<nx;i++){
      var c=color((M[t][i]-center)/mx), p=(t*nx+i)*4;
      img.data[p]=c[0]; img.data[p+1]=c[1]; img.data[p+2]=c[2]; img.data[p+3]=255;
    }
    oc.putImageData(img,0,0);
    var g=prep(canvas);
    g.ctx.imageSmoothingEnabled=true; g.ctx.imageSmoothingQuality='high';
    g.ctx.drawImage(off,0,0,nx,nt,0,0,g.w,g.h);
    return mx;
  }
  function line(canvas, data, opts){
    opts = opts||{};
    var g=prep(canvas), ctx=g.ctx, W=g.w, H=g.h;
    var padL=34, pad=8, w=W-padL-pad, h=H-pad*2-(opts.ticks?10:0);
    var mx=0, i;
    for (i=0;i<data.length;i++) mx=Math.max(mx,Math.abs(data[i]));
    if (mx<1e-9) mx=1;
    var zero = pad+h/2;
    var bot = pad+h;

    if (opts.ticks){
      ctx.font='10px ui-monospace,Menlo,monospace'; ctx.textAlign='center';
      for (var k=0;k<opts.ticks.length;k++){
        var tk=opts.ticks[k], px=padL + w*tk.pos;
        ctx.strokeStyle='#ececea'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(px+.5,pad); ctx.lineTo(px+.5,bot); ctx.stroke();
        ctx.fillStyle='#a8a8a2';
        ctx.fillText(tk.text, px, H-1);
      }
    }
    ctx.strokeStyle='#e3e3df'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,zero+.5); ctx.lineTo(padL+w,zero+.5); ctx.stroke();

    var n=data.length;
    function pxAt(i){ return padL + w*i/(n-1); }
    function pyAt(v){ return zero - (v/mx)*(h/2)*0.86; }

    ctx.beginPath();
    ctx.moveTo(padL, zero);
    for (i=0;i<n;i++) ctx.lineTo(pxAt(i), pyAt(data[i]));
    ctx.lineTo(padL+w, zero); ctx.closePath();
    ctx.fillStyle = opts.fill || 'rgba(47,109,246,.10)';
    ctx.fill();

    ctx.beginPath();
    for (i=0;i<n;i++){ var X0=pxAt(i), Y0=pyAt(data[i]); if (i===0) ctx.moveTo(X0,Y0); else ctx.lineTo(X0,Y0); }
    ctx.strokeStyle=opts.color||'#2f6df6'; ctx.lineWidth=1.5; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.stroke();

    if (opts.ylab){
      ctx.font='10px ui-monospace,Menlo,monospace'; ctx.textAlign='right'; ctx.fillStyle='#a8a8a2';
      ctx.fillText(mx.toFixed(1), padL-5, pad+9);
      ctx.fillText('-' + mx.toFixed(1), padL-5, bot);
    }
  }

  /* ================= 渲染 ================= */
  var rawMax = null, rawCenter = 0;
  var COLS  = ['#2f6df6','#c0392b','#2f8f5b'];
  var FILLS = ['rgba(47,109,246,.11)','rgba(192,57,43,.11)','rgba(47,143,91,.11)'];

  function fillMods(){
    var h = '';
    var sub = (mode==='tao') ? '空间型（按经度）' : '空间模态';
    for (var k=0;k<3;k++) h +=
      '<div><div class="st">EOF ' + (k+1) + ' <span>' + sub + '</span></div>' +
      '<div class="fig"><canvas id="c-eof'+(k+1)+'" height="126"></canvas></div></div>' +
      '<div><div class="st">PC ' + (k+1) + ' <span>时间系数</span></div>' +
      '<div class="fig"><canvas id="c-pc'+(k+1)+'" height="'+(mode==='tao'?136:126)+'"></canvas></div></div>';
    document.getElementById('modes').innerHTML = h;
  }

  function render(){
    var i, k, t;
    document.getElementById('o-k').textContent = document.getElementById('s-k').value;
    var nx = X[0].length, nt = X.length;

    var rawC = document.getElementById('c-raw');
    if (rawMax === null) rawMax = heat(rawC, X, null, rawCenter);
    else heat(rawC, X, rawMax, rawCenter);

    var bars='';
    for (k=0;k<Math.min(5,SOL.modes.length);k++){
      var pv = SOL.modes[k].varr*100;
      bars += '<div class="bar"><span class="lab">EOF '+(k+1)+'</span>' +
        '<span class="track"><span class="fill" style="width:'+Math.max(pv,0.6).toFixed(1)+'%;background:'+COLS[k%3]+'"></span></span>' +
        '<span class="val">'+pv.toFixed(1)+'%</span></div>';
    }
    document.getElementById('bars').innerHTML = bars;

    var ticks = null;
    if (mode==='tao'){
      ticks = [];
      for (var y=1995; y<=2025; y+=5){
        var idx = TAO.time.indexOf(y+'-01');
        if (idx>=0) ticks.push({ pos: idx/(nt-1), text: String(y) });
      }
    }
    for (k=0;k<3;k++){
      var ce = document.getElementById('c-eof'+(k+1));
      var cp = document.getElementById('c-pc'+(k+1));
      if (!ce || !cp || !SOL.modes[k]) continue;
      line(ce, SOL.modes[k].eof, { color:COLS[k], fill:'rgba(0,0,0,0)', ylab:true });
      line(cp, SOL.modes[k].pc,  { color:COLS[k], fill:FILLS[k], ticks:ticks, ylab:true });
    }

    var kk = +document.getElementById('s-k').value;
    var rec = reconstruct(kk);
    heat(document.getElementById('c-rec'), rec, rawMax, rawCenter);

    var num=0, den=0;
    for (t=0;t<nt;t++){
      var mm = SOL.useClim ? (+TAO.time[t].slice(5,7))-1 : -1;
      var mu = SOL.useClim ? SOL.clim[mm] : SOL.mean;
      for (i=0;i<nx;i++){
        var d = X[t][i] - rec[t][i];
        num += d*d;
        den += Math.pow(X[t][i]-mu[i], 2);
      }
    }
    document.getElementById('resid').textContent = (100*num/(den||1)).toFixed(1)+'%';
  }

  var timer=null;
  function schedule(){ clearTimeout(timer); timer=setTimeout(recompute, 30); }

  function recompute(){
    if (mode==='tao') buildTao(); else buildSyn();
    solve();
    rawMax = null;
    /* 原始场以自身均值为色标中心，否则海温这种非零均值场会整片偏色 */
    var sum = 0, cnt = 0;
    for (var ti = 0; ti < X.length; ti++) for (var xi = 0; xi < X[0].length; xi++){ sum += X[ti][xi]; cnt++; }
    rawCenter = sum / cnt;
    fillMods();

    document.getElementById('axL').textContent = (mode==='tao')
      ? '← 经度 ' + TAO.lon[0] + '°E' : '← 空间 x →';
    document.getElementById('axR').textContent = (mode==='tao')
      ? TAO.lon[TAO.lon.length-1] + '°E · ↓ 时间' : '↓ 时间 t';
    document.getElementById('rawLab').textContent = (mode==='tao')
      ? 'X(t, 经度) · 1 m 月平均海温' : 'X(t, x)';

    if (mode==='tao'){
      var ns = TAO.station.length, nt = TAO.time.length;
      document.getElementById('src').innerHTML =
        '数据来源：<b>NOAA/PMEL 全球热带锚定浮标阵列（GTMBA / TAO-TRITON）</b> —— 赤道太平洋 ' + ns +
        ' 个浮标，1 m 层月平均海温，' + TAO.time[0] + ' 至 ' + TAO.time[nt-1] + '（' + nt + ' 个月）。' +
        '缺测 24.8% 已沿时间线性插补；分析前扣除各月气候态以去掉季节循环。<br>' +
        '获取方式：<a href="https://coastwatch.pfeg.noaa.gov/erddap/tabledap/pmelTaoMonT.html" target="_blank" rel="noopener">ERDDAP tabledap / pmelTaoMonT</a>' +
        ' &nbsp;·&nbsp; 站点经度：' + TAO.lon.map(function(l){ return l + '°E'; }).join('、');
      document.getElementById('evt').innerHTML =
        'PC1 的两个最大正值出现在 <code>1997-12</code> 与 <code>2015-11</code> —— ' +
        '有观测记录以来最强的两次厄尔尼诺；<code>2010-12</code> 为强负值，对应拉尼娜。';
      document.getElementById('pts').innerHTML =
        '<li><b>EOF1 占约 63%</b>：空间型在暖池（147–165°E）接近零，向中东太平洋单调增强，' +
        '即赤道中东太平洋一致增暖 —— 这是典型的厄尔尼诺型。</li>' +
        '<li><b>PC1 就是 ENSO 指数</b>：正位相为厄尔尼诺，负位相为拉尼娜，与业务 ONI 指数高度一致。</li>' +
        '<li><b>EOF2 占约 16%</b>：东西反向的偶极结构，反映暖池边缘位移与 ENSO 位相转换。</li>' +
        '<li>前两阶合计约 79%，其余归入噪声。EOF 按方差降序排列，编号与物理机制无关。</li>';
    } else {
      document.getElementById('src').innerHTML =
        '合成数据：真实模态为两个正交的正弦 <code>sin(πx)</code> 与 <code>sin(2πx)</code>，' +
        '各乘以一条互不相关的随机时间系数，再叠加白噪声。拖动滑块改变强度，检验 EOF 能否还原它们。';
      document.getElementById('evt').innerHTML = '';
      document.getElementById('pts').innerHTML =
        '<li><b>EOF</b> 是协方差矩阵的特征向量，代表场在空间上的典型分布形态。</li>' +
        '<li><b>PC</b> 是相应特征向量上的投影系数，表示这个形态在不同时刻的强弱与正负。</li>' +
        '<li><b>方差贡献</b> 即特征值占比。EOF 按方差降序排列，<b>编号与物理机制无关</b> —— 把某个模态调强，它就会升为第一阶。</li>' +
        '<li>取前几阶即可抓住主要信号，其余归入噪声。</li>';
    }
    render();
  }

  /* ================= 交互 ================= */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      mode = b.getAttribute('data-m');
      document.getElementById('synPanel').style.display = (mode==='syn') ? 'flex' : 'none';
      schedule();
    });
  });

  ['s-a1','s-a2','s-nz'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      document.getElementById('o-a1').textContent = (+document.getElementById('s-a1').value/50).toFixed(2);
      document.getElementById('o-a2').textContent = (+document.getElementById('s-a2').value/50).toFixed(2);
      document.getElementById('o-nz').textContent = document.getElementById('s-nz').value + '%';
      schedule();
    });
  });
  document.getElementById('s-k').addEventListener('input', render);
  document.getElementById('btn-new').addEventListener('click', function(){
    rndSeed = (Date.now() & 0x7fffffff) || 1;
    schedule();
  });

  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt); rt = setTimeout(function(){ rawMax=null; render(); }, 160);
  });

  /* 支持 #tao 直接打开实测数据集 */
  if (location.hash === '#tao'){
    mode = 'tao';
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){
      x.classList.toggle('on', x.getAttribute('data-m') === 'tao');
    });
    document.getElementById('synPanel').style.display = 'none';
  }

  recompute();
})();
</script>
</body>
</html>
