name: 对齐素材库

# 每次推送后扫描 content/ 与 content/pages/，更新 data/library.json。
# 这样在本地直接写 Markdown / HTML 再 push，列表页也会自动更新。

on:
  push:
    branches: [main]
    paths:
      - 'content/**/*.md'
      - 'content/pages/**'
      - 'tools/lib/library.mjs'
      - 'tools/build-index.mjs'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-index]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 对齐 data/library.json
        run: node tools/build-index.mjs

      - name: 有变化则提交
        run: |
          if [ -z "$(git status --porcelain data/library.json)" ]; then
            echo "素材库已是最新，无需提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/library.json
          git commit -m "更新素材库 [skip-index]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
